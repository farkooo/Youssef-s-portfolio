  <rect x="400" y="105" width="170" height="135" rx="8" fill="#161d30" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="485" y="132" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" text-anchor="middle">STRUCTURED STORE</text>
  <text x="485" y="155" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Relational Schema</text>
  <line x1="415" y1="168" x2="555" y2="168" stroke="#2a3449" stroke-width="1"/>
  <text x="485" y="188" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">SQLite / SQL Server</text>
  <text x="485" y="208" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Clean CSV / Excel</text>
  <text x="485" y="228" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">[Analytics Ready]</text>

  <!-- Footer Tag -->
