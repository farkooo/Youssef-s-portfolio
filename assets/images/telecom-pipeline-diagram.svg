<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
    <linearGradient id="pipeBluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#pipeBgGrad)" rx="12"/>

  <!-- Title Label -->
  <text x="30" y="40" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Automated Network Log Quality &amp; Profiling Engine</text>
  <text x="30" y="58" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Python 3 · Pandas · Anomaly Quarantine · 250,000+ Session Records</text>

  <!-- Step 1: Raw Ingestion -->
  <rect x="30" y="105" width="115" height="135" rx="8" fill="#161d30" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="87" y="132" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" text-anchor="middle">INGESTION</text>
  <text x="87" y="155" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">250K+ Records</text>
  <text x="87" y="175" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Corrupted Logs</text>
  <text x="87" y="195" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Nulls &amp; Outliers</text>
  <text x="87" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Format Drift</text>

  <!-- Arrow 1 -->
  <path d="M145 170 L175 170" stroke="#6366f1" stroke-width="2" fill="none"/>
  <polygon points="178,170 171,166 171,174" fill="#6366f1"/>

  <!-- Step 2: Quality Engine -->
  <rect x="180" y="90" width="165" height="165" rx="10" fill="#161d30" stroke="url(#pipeBluePurple)" stroke-width="2"/>
  <rect x="190" y="100" width="145" height="24" rx="4" fill="url(#pipeBluePurple)"/>
  <text x="262" y="116" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" text-anchor="middle">QUALITY ENGINE</text>
  <text x="262" y="145" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Regex Sanitization</text>
  <text x="262" y="165" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Schema Profiling</text>
  <text x="262" y="185" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Rule Assertions</text>
  <text x="262" y="205" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Vectorized Transforms</text>
  <text x="262" y="235" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">-65% Execution Time</text>

  <!-- Bifurcated Output Arrows -->
  <path d="M345 150 L395 130" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="398,129 389,127 393,135" fill="#10b981"/>

  <path d="M345 190 L395 210" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <polygon points="398,211 393,205 389,213" fill="#f43f5e"/>

  <!-- Clean Output -->
  <rect x="400" y="95" width="170" height="70" rx="8" fill="#161d30" stroke="#10b981" stroke-width="1.5"/>
  <text x="485" y="120" fill="#34d399" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" text-anchor="middle">CLEAN DATASET (96.8%)</text>
  <text x="485" y="140" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Analytics-Ready Parquet &amp; CSV</text>
  <text x="485" y="155" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Validated Foreign Keys</text>

  <!-- Quarantine Output -->
  <rect x="400" y="175" width="170" height="70" rx="8" fill="#161d30" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="485" y="200" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" text-anchor="middle">QUARANTINE AUDIT (3.2%)</text>
  <text x="485" y="220" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Flagged Error Diagnostics</text>
  <text x="485" y="235" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Zero Pipeline Failures</text>

  <!-- Footer Tag -->
  <text x="300" y="295" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Automated End-to-End Pipeline with Zero-Drop Error Handling</text>
</svg>
